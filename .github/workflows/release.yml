name: Release

# Builds Epingle.exe from source and attaches it to the GitHub release.
#  - automatically when a tag v* is pushed (or created from the Releases page)
#  - manually (Actions > Release > Run workflow) for an existing tag
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Epingle.exe (MSVC)
        shell: cmd
        run: build.bat

      - name: Check imports (no network library)
        shell: bash
        run: |
          dumpbin //nologo //imports build/Epingle.exe | grep -i '\.dll' | tee imports.txt
          if grep -iqE 'ws2_32|wininet|winhttp|urlmon|wsock32|iphlpapi|winsock' imports.txt; then
            echo "::error::network library imported"; exit 1
          fi

      - name: Publish to the release
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          **Épingle** garde une fenêtre au premier plan avec un raccourci clavier.

          ### Utilisation
          1. Téléchargez `Epingle.exe` ci-dessous (aucune installation).
          2. Lancez-le. Une icône apparaît près de l'horloge.
          3. **Alt + ²** épingle la fenêtre active. Une lueur bleu/vert animée l'entoure. Refaites-le pour la libérer.
          4. Clic sur l'icône pour modifier le raccourci, libérer toutes les fenêtres ou lancer l'app au démarrage.

          ### Confidentialité
          - Aucun accès réseau, aucune télémétrie (vérifié automatiquement à chaque build).
          - Droits utilisateur standard, jamais d'administrateur.
          - Réglages dans `HKEY_CURRENT_USER\Software\Epingle`.

          ### Note
          L'exécutable n'est pas signé : au premier lancement, SmartScreen peut afficher « Windows a protégé votre ordinateur ». Cliquez sur **Informations complémentaires → Exécuter quand même**.

          Windows 10 / 11, 64 bits. Compilé avec MSVC (Visual Studio) à partir du code de ce tag par GitHub Actions.
          NOTES
          printf '\nSHA-256 : `%s`\n' "$(sha256sum build/Epingle.exe | cut -d' ' -f1)" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Epingle.exe --clobber
            gh release edit "$TAG" --title "Épingle ${TAG#v}" --notes-file notes.md
          else
            gh release create "$TAG" build/Epingle.exe --title "Épingle ${TAG#v}" --notes-file notes.md
          fi
